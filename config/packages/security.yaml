security:
    # 1. Gestion du hachage des mots de passe
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # 2. Définition du fournisseur d'utilisateurs (User Provider)
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email # On utilise l'email comme identifiant unique

    # 3. Hiérarchie des rôles (Tes réglages conservés)
    role_hierarchy:
        ROLE_ABONNE:      ROLE_USER
        ROLE_AUTEUR:      ROLE_ABONNE
        ROLE_EDITEUR:     ROLE_AUTEUR
        ROLE_DESIGNER:    ROLE_USER
        ROLE_FOURNISSEUR: ROLE_USER
        ROLE_ADMIN:       [ROLE_EDITEUR, ROLE_DESIGNER, ROLE_FOURNISSEUR]

    # 4. Configuration des pare-feux (Firewalls)
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # PARE-FEU DE CONNEXION : Intercepte le POST JSON de React
        login:
            pattern: ^/api/login_check
            stateless: true
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
                username_path: email # Dit à Symfony de lire la clé "email" dans ton JSON React

        # PROTECTION DES ROUTES API : Vérifie la présence du Token JWT
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

        # PARE-FEU PRINCIPAL (Session classique pour Twig/Admin)
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
            logout:
                path: app_logout
                target: app_login

    # 5. Contrôle d'accès (Access Control)
    access_control:
        # Routes publiques (Accessibles sans être connecté)
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/articles, roles: PUBLIC_ACCESS, methods: [GET] }
        
        # Routes protégées par rôle
        - { path: ^/api/articles, roles: ROLE_AUTEUR, methods: [POST, PUT, DELETE] }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10